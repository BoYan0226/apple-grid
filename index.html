<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apple Grid</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { height: 44px; background: #fff; }
    main, .heroes { display: grid; gap: 12px; }
    .heroes div { height: 692px; background: #f5f5f7; }
    .heroes div:last-child { background: #000; }

    /* 两列三行 */
    .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
    .products div { height: 580px; background: #f5f5f7; }
    .products div:nth-child(1), .products div:nth-child(3) { background: #000; }

    /* 横向格子 */
    .entertainment { background: #f5f5f7; padding: 137px 0 50px; overflow: hidden; }
    .movies, .services { display: flex; justify-content: center; gap: 12px; }
    .movies div { flex: 0 0 1250px; height: 668px; background: #aec9d6; }
    .movies div:first-child { background: #6b8d5c; }
    .movies div:last-child { background: #dadcc3; }
    .services { margin: 13px 0 0; }
    .services div { flex: 0 0 470px; height: 264px; background: #bda0bb; }
    .services div:nth-child(2) { background: #897e50; }
    .services div:nth-child(4) { background: #222; }
    .services div:last-child { background: #176589; }
    footer { height: 996px; background: #f5f5f7; }

    @media (max-width: 1068px) {
      .heroes div { height: 650px; }
      .products div { height: 490px; }
      .entertainment { padding: 100px 0 37px; }
      .movies div { flex-basis: 689px; height: 367px; }
      .services div { flex-basis: 452px; height: 254px; }
    }
    @media (max-width: 734px) {
      header { height: 48px; }
      .heroes div, .products div { height: 500px; }
      .products { grid-template-columns: 1fr; padding: 0; }
      .entertainment { padding: 96px 0 37px; }
      .movies div { flex-basis: 274px; height: 496px; }
      .services div { flex-basis: 280px; }
      footer { height: 1523px; }
    }
  </style>
</head>
<body>
  <header></header>
  <main>
    <div class="heroes">
      <div></div><div></div><div></div>
    </div>
    <div class="products">
      <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
    <div class="entertainment">
      <div class="movies"><div></div><div></div><div></div></div>
      <div class="services"><div></div><div></div><div></div><div></div><div></div></div>
    </div>
  </main>
  <footer></footer>
</body>
</html>
